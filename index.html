  <!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EASE FLASH CORRIDAS - CHAMOU, CHEGOU!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
.header{background:#ffcc00;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:22px;font-weight:900}
.header p{font-size:13px;font-weight:700}
.lang-bar{background:#111;color:#fff;padding:8px;display:flex;gap:6px;overflow-x:auto;justify-content:center;flex-wrap:wrap}
.lang-bar button{border:1px solid #ffcc00;background:#222;color:#fff;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer}
.lang-bar button.active{background:#ffcc00;color:#000;font-weight:900}
.tabs{display:flex;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.tabs button{flex:1;padding:13px 5px;border:none;background:#fff;font-weight:800;font-size:12px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.active{border-bottom:3px solid #ffcc00;background:#fffde6}
.content{padding:15px;max-width:500px;margin:0 auto}
.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:10px}
label{font-size:13px;font-weight:700;display:block;margin-top:10px}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-top:4px;font-size:14px}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#ffcc00;font-weight:900;font-size:15px;margin-top:14px;cursor:pointer}
.btn-black{background:#111;color:#ffcc00}
.qr-box{text-align:center}
.qr-box img{width:170px;height:170px;border:6px solid #fff;box-shadow:0 0 0 1px #ddd;border-radius:10px}
.price{font-size:12px;color:#666;margin-top:6px}
.moto-car{display:flex;gap:10px;margin-top:10px}
.moto-car button{flex:1;padding:12px;border:2px solid #ddd;border-radius:10px;font-weight:800;cursor:pointer;background:#fff}
.moto-car button.active{border-color:#ffcc00;background:#fffde6}
.footer{text-align:center;font-size:11px;color:#888;padding:15px}
#page-motoristas,#page-clientes,#page-mapa{display:none}
</style>
</head>
<body>

<div class="header"><h1 id="t_title">EASE FLASH CORRIDAS</h1><p id="t_sub">CHAMOU, CHEGOU! PARANAGUÁ</p></div>

<div class="lang-bar">
<button onclick="setLang('pt',this)" class="active">BR PT</button>
<button onclick="setLang('en',this)">US EN</button>
<button onclick="setLang('es',this)">ES ES</button>
<button onclick="setLang('fr',this)">FR FR</button>
<button onclick="setLang('de',this)">DE DE</button>
<button onclick="setLang('it',this)">IT IT</button>
<button onclick="setLang('zh',this)">CN ZH</button>
<button onclick="setLang('ja',this)">JP JA</button>
<button onclick="setLang('ar',this)">SA AR</button>
</div>

<div class="tabs">
<button id="tab-corrida" class="active" onclick="showTab('corrida')">CORRIDA</button>
<button id="tab-motoristas" onclick="showTab('motoristas')">MOTORISTAS</button>
<button id="tab-clientes" onclick="showTab('clientes')">CLIENTES</button>
<button id="tab-mapa" onclick="showTab('mapa')">MAPA</button>
</div>

<div class="content">
<div id="page-corrida" class="card">
<h2 id="t_ride">Pedir Corrida</h2>
<div class="moto-car">
<button id="btnCar" class="active" onclick="setModo('car')">CARRO</button>
<button id="btnMoto" onclick="setModo('moto')">MOTO</button>
</div>
<label id="t_from">De onde?</label><input id="from" placeholder="Ex: Rodoviaria Paranaguá">
<label id="t_to">Para onde?</label><input id="to" placeholder="Ex: Centro, Porto">
<label id="t_pay">Pagamento</label>
<select id="pay"><option>Dinheiro / Pix</option><option>QR Code - Mercado Pago</option><option>PayPal</option><option>Cartão</option></select>
<button class="btn" onclick="pedir()" id="t_call">CHAMAR AGORA - CHAMOU, CHEGOU!</button>
<p style="text-align:center;font-size:12px;margin-top:8px">EASE FLASH - Carro e Moto em Paranaguá</p>
<div class="qr-box" style="margin-top:12px">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=https://donarita1983rita3.github.io/app-de-corridas/">
<p class="price">Aponta a câmera - Chama no WhatsApp 41 98809-9495</p>
</div>
</div>

<div id="page-motoristas" class="card">
<h2 id="t_driverTitle">Cadastro Motorista</h2>
<label>Nome Completo</label><input id="nomeM" placeholder="Seu nome">
<label>WhatsApp / Celular</label><input id="zapM" placeholder="(41) 99999-9999">
<label>Carro ou Moto?</label><select id="veicM"><option>Carro</option><option>Moto</option></select>
<label>Placa</label><input id="placaM" placeholder="ABC-1234">
<label>Email</label><input id="emailM" placeholder="seu@email.com">
<button class="btn" onclick="cadMotorista()" id="t_register">CADASTRAR COMO MOTORISTA</button>
</div>

<div id="page-clientes" class="card">
<h2 id="t_clientTitle">Cadastro Cliente</h2>
<label>Nome</label><input id="nomeC" placeholder="Seu nome">
<label>WhatsApp</label><input id="zapC" placeholder="(41) 99999-9999">
<label>Bairro</label><input id="bairroC" placeholder="Ex: Centro, Vila Paranaguá">
<button class="btn btn-black" onclick="cadCliente()">CADASTRAR COMO CLIENTE</button>
</div>

<div id="page-mapa" class="card">
<h2>Mapa - Paranaguá</h2>
<iframe src="https://maps.google.com/maps?q=Paranagua,PR&t=&z=13&ie=UTF8&iwloc=&output=embed" width="100%" height="300" style="border:0;border-radius:10px"></iframe>
</div>
</div>

<div class="footer">EASE FLASH © 2026 - Paranaguá - WhatsApp: 41 98809-9495</div>

<script>
const WHATS = "5541988099495";
let modoAtual = "car";

function showTab(t){
  ['corrida','motoristas','clientes','mapa'].forEach(id=>{
    document.getElementById('page-'+id).style.display = id===t ? 'block' : 'none';
    document.getElementById('tab-'+id).classList.toggle('active', id===t);
  });
  if(t==='corrida') document.getElementById('page-corrida').style.display='block';
}
function setModo(m){
  modoAtual=m;
  document.getElementById('btnCar').classList.toggle('active', m==='car');
  document.getElementById('btnMoto').classList.toggle('active', m==='moto');
}
function pedir(){
  let de=document.getElementById('from').value||"Não informado";
  let para=document.getElementById('to').value||"Não informado";
  let pag=document.getElementById('pay').value;
  let msg="Olá! EASE FLASH! CHAMOU, CHEGOU!%0A%0AQuero corrida:%0ADe: "+encodeURIComponent(de)+"%0APara: "+encodeURIComponent(para)+"%0ATipo: "+modoAtual.toUpperCase()+"%0APagamento: "+encodeURIComponent(pag);
  window.open("https://wa.me/"+WHATS+"?text="+msg,"_blank");
}
function cadMotorista(){
  let nome=document.getElementById('nomeM').value;
  let zap=document.getElementById('zapM').value;
  let veic=document.getElementById('veicM').value;
  let placa=document.getElementById('placaM').value;
  let email=document.getElementById('emailM').value;
  let msg="Quero ser MOTORISTA EASE FLASH!%0A%0ANome: "+encodeURIComponent(nome)+"%0AWhats: "+encodeURIComponent(zap)+"%0AVeiculo: "+veic+"%0APlaca: "+encodeURIComponent(placa)+"%0AEmail: "+encodeURIComponent(email);
  window.open("https://wa.me/"+WHATS+"?text="+msg,"_blank");
}
function cadCliente(){
  let nome=document.getElementById('nomeC').value;
  let zap=document.getElementById('zapC').value;
  let bairro=document.getElementById('bairroC').value;
  let msg="Quero ser CLIENTE EASE FLASH!%0A%0ANome: "+encodeURIComponent(nome)+"%0AWhats: "+encodeURIComponent(zap)+"%0ABairro: "+encodeURIComponent(bairro);
  window.open("https://wa.me/"+WHATS+"?text="+msg,"_blank");
}

const traducao={
  pt:{title:"EASE FLASH CORRIDAS",sub:"CHAMOU, CHEGOU! PARANAGUÁ",ride:"Pedir Corrida",from:"De onde?",to:"Para onde?",pay:"Pagamento",call:"CHAMAR AGORA - CHAMOU, CHEGOU!",driver:"Cadastro Motorista",client:"Cadastro Cliente",register:"CADASTRAR COMO MOTORISTA"},
  en:{title:"EASE FLASH RIDES",sub:"YOU CALLED, WE ARRIVED! PARANAGUÁ",ride:"Request Ride",from:"From where?",to:"To where?",pay:"Payment",call:"CALL NOW - YOU CALLED, WE ARRIVED!",driver:"Driver Registration",client:"Client Registration",register:"REGISTER AS DRIVER"},
  es:{title:"EASE FLASH VIAJES",sub:"¡LLAMASTE, LLEGAMOS! PARANAGUÁ",ride:"Pedir Viaje",from:"¿Desde dónde?",to:"¿Hasta dónde?",pay:"Pago",call:"LLAMAR AHORA - ¡LLAMASTE, LLEGAMOS!",driver:"Registro Conductor",client:"Registro Cliente",register:"REGISTRAR COMO CONDUCTOR"},
  fr:{title:"EASE FLASH COURSES",sub:"APPELÉ, ARRIVÉ! PARANAGUÁ",ride:"Demander Course",from:"D'où?",to:"Où?",pay:"Paiement",call:"APPELER MAINTENANT",driver:"Inscription Chauffeur",client:"Inscription Client",register:"S'INSCRIRE COMME CHAUFFEUR"},
  de:{title:"EASE FLASH FAHRTEN",sub:"GERUFEN, ANGEKOMMEN! PARANAGUÁ",ride:"Fahrt bestellen",from:"Woher?",to:"Wohin?",pay:"Zahlung",call:"JETZT RUFEN",driver:"Fahrer Registrierung",client:"Kunden Registrierung",register:"ALS FAHRER REGISTRIEREN"},
  it:{title:"EASE FLASH CORSE",sub:"CHIAMATO, ARRIVATO! PARANAGUÁ",ride:"Richiedi Corsa",from:"Da dove?",to:"Dove?",pay:"Pagamento",call:"CHIAMA ORA",driver:"Registrazione Autista",client:"Registrazione Cliente",register:"REGISTRATI COME AUTISTA"},
  zh:{title:"EASE FLASH 出行",sub:"随叫随到! PARANAGUÁ",ride:"叫车",from:"从哪里?",to:"到哪里?",pay:"支付",call:"立即叫车",driver:"司机注册",client:"客户注册",register:"注册为司机"},
  ja:{title:"EASE FLASH ライド",sub:"呼んだら、到着! PARANAGUÁ",ride:"ライドを注文",from:"どこから?",to:"どこへ?",pay:"支払い",call:"今すぐ呼ぶ",driver:"ドライバー登録",client:"お客様登録",register:"ドライバーとして登録"},
  ar:{title:"EASE FLASH مشاوير",sub:"اتصل، وصلنا! PARANAGUÁ",ride:"اطلب مشوار",from:"من أين؟",to:"إلى أين؟",pay:"الدفع",call:"اتصل الآن",driver:"تسجيل سائق",client:"تسجيل عميل",register:"سجل كسائق"}
};

function setLang(lang,btn){
  document.querySelectorAll('.lang-bar button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  let t=traducao[lang]||traducao.pt;
  document.getElementById('t_title').innerText=t.title;
  document.getElementById('t_sub').innerText=t.sub;
  document.getElementById('t_ride').innerText=t.ride;
  document.getElementById('t_from').innerText=t.from;
  document.getElementById('t_to').innerText=t.to;
  document.getElementById('t_pay').innerText=t.pay;
  document.getElementById('t_call').innerText=t.call;
  document.getElementById('t_driverTitle').innerText=t.driver;
  document.getElementById('t_clientTitle').innerText=t.client;
  document.getElementById('t_register').innerText=t.register;
}
showTab('corrida');
</script>
</body>
</html>
