 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EASE FLASH APP DE CORRIDAS</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;margin:0;padding:10px}
.card{background:#111;border-radius:16px;padding:16px;margin:10px 0;border:1px solid #222}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;margin:6px 0;background:#fff;color:#111;font-weight:700}
button{width:100%;padding:14px;border-radius:12px;border:none;margin:6px 0;font-weight:900;cursor:pointer;font-size:15px}
.btn-calc{background:#FFE600;color:#000;box-shadow:0 0 15px rgba(255,230,0,0.4)}
.btn-save{background:#fff;color:#000}
.btn-zap{background:#FFE600;color:#000}
.btn-mp{background:#009EE3;color:#fff}
h2{color:#FFE600;text-shadow:0 0 10px rgba(255,230,0,0.5)}
#qrcode{display:flex;justify-content:center;margin-top:12px}
.qrbox{background:#fff;color:#111;padding:12px;border-radius:12px;text-align:center;border:2px solid #FFE600}
</style>
</head>
<body>
<h2 style="text-align:center;font-size:26px;margin:20px 0">⚡ EASE FLASH APP DE CORRIDAS ⚡</h2>

<div class="card">
<input id="nome" placeholder="Nome do cliente">
<input id="origem" placeholder="Origem">
<input id="destino" placeholder="Destino" value="5">
<button class="btn-calc" onclick="calc()">💰 CALCULAR PREÇO</button>
<div id="res" style="text-align:center;padding:12px;background:#111;border-radius:10px;margin:10px 0;display:none;border:1px solid #FFE600"></div>
<div id="qrcode"></div>
<button class="btn-save" onclick="salvar()">✅ CONFIRMAR E SALVAR</button>
<button class="btn-zap" onclick="zap()">📱 ENVIAR NO ZAP</button>
<button class="btn-mp" onclick="cartao()">💳 PAGAR COM CARTÃO / PIX - MERCADO PAGO</button>
</div>

<div class="card">
<h3 style="color:#FFE600">Histórico</h3>
<div id="lista"></div>
</div>

<script>
var hist = JSON.parse(localStorage.getItem('hist')||'[]');
var preco = 0;
var MEU_LINK = "https://link.mercadopago.com.br/donaritacorridas";
function calc(){
var d = parseFloat(document.getElementById('destino').value)||5;
preco = Math.round(5 + d*2.5);
var r=document.getElementById('res');
r.style.display='block';
r.innerHTML="Distância: "+d+"km<br><b style='color:#FFE600;font-size:20px'>Preço: R$"+preco+"</b>";
var q=document.getElementById('qrcode');
q.innerHTML='<div class="qrbox"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(MEU_LINK)+'" style="width:180px"><br><b>MERCADO PAGO</b><br>R$'+preco+'</div>';
}
function salvar(){
var n=document.getElementById('nome').value;
if(!n){alert('Coloca o nome');return}
hist.unshift({nome:n,valor:preco,data:new Date().toLocaleDateString()});
localStorage.setItem('hist',JSON.stringify(hist));
render();
alert('Salvo R$'+preco);
}
function render(){
document.getElementById('lista').innerHTML=hist.map(o=>'<div style="padding:8px 0;border-bottom:1px solid #222"><b style=\"color:#FFE600\">'+o.nome+'</b> - R$'+o.valor+' - '+o.data+'</div>').join('')||'Sem histórico';
}
function zap(){
var n=document.getElementById('nome').value||'Cliente';
var txt='Olá! ⚡ Ease Flash - Cliente: '+n+' - Valor R$'+preco+' - Pague aqui: '+MEU_LINK;
window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
function cartao(){window.open(MEU_LINK,'_blank');}
render();
</script>
</body>
</html>
