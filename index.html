 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EASE FLASH APP DE CORRIDAS</title>
</head>
<body style="background:#0f0f0f;color:#fff;font-family:sans-serif;margin:0;padding:10px">
<h2 style="text-align:center;font-size:28px">EASE FLASH APP DE CORRIDAS</h2>

<div style="background:#1a1a1a;border-radius:16px;padding:16px;margin:10px 0">
<input id="nome" placeholder="Nome do cliente" style="width:100%;padding:14px;border-radius:12px;margin:6px 0">
<input id="origem" placeholder="Origem" style="width:100%;padding:14px;border-radius:12px;margin:6px 0">
<input id="destino" placeholder="Destino" value="5" style="width:100%;padding:14px;border-radius:12px;margin:6px 0">
<button onclick="calc()" style="width:100%;padding:14px;border-radius:12px;font-weight:700;margin:6px 0">💰 CALCULAR PREÇO</button>
<div id="res" style="text-align:center;padding:12px;background:#111;border-radius:10px;margin:10px 0;display:none"></div>
<div id="qrcode" style="display:flex;justify-content:center"></div>
<button onclick="salvar()" style="width:100%;padding:14px;border-radius:12px;font-weight:700;margin:6px 0;background:#fff;color:#111">✅ CONFIRMAR E SALVAR</button>
<button onclick="zap()" style="width:100%;padding:14px;border-radius:12px;font-weight:700;margin:6px 0;background:#25D366;color:#fff">📱 ENVIAR NO ZAP</button>
<button onclick="cartao()" style="width:100%;padding:14px;border-radius:12px;font-weight:700;margin:6px 0;background:#009EE3;color:#fff">💳 PAGAR COM CARTÃO / PIX - MERCADO PAGO</button>
</div>

<div style="background:#1a1a1a;border-radius:16px;padding:16px;margin:10px 0">
<h3>Histórico</h3>
<div id="lista"></div>
</div>

<script>
var hist = JSON.parse(localStorage.getItem('hist')||'[]');
var preco = 0;
var MEU_LINK = "https://link.mercadopago.com.br/donaritacorridas";
function calc(){
var d = parseFloat(document.getElementById('destino').value)||5;
preco = Math.round(5 + d*2.5);
var r=document.getElementById('res');
r.style.display='block';
r.innerHTML="Distância: "+d+"km<br>Preço: R$"+preco;
var q=document.getElementById('qrcode');
q.innerHTML='<div style="background:#fff;color:#111;padding:12px;border-radius:12px;text-align:center"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(MEU_LINK)+'" style="width:180px"><br><b>MERCADO PAGO</b><br>R$'+preco+'</div>';
}
function salvar(){
var n=document.getElementById('nome').value;
if(!n){alert('Coloca o nome');return}
hist.unshift({nome:n,valor:preco,data:new Date().toLocaleDateString()});
localStorage.setItem('hist',JSON.stringify(hist));
render();
alert('Salvo R$'+preco);
}
function render(){
document.getElementById('lista').innerHTML=hist.map(o=>'<div style="padding:8px 0;border-bottom:1px solid #222"><b>'+o.nome+'</b> - R$'+o.valor+' - '+o.data+'</div>').join('')||'Sem histórico';
}
function zap(){
var n=document.getElementById('nome').value||'Cliente';
var txt='Olá! Ease Flash - Cliente: '+n+' - Valor R$'+preco+' - Pague aqui: '+MEU_LINK;
window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
function cartao(){window.open(MEU_LINK,'_blank');}
render();
</script>
</body>
</html>
