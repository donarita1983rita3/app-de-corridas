 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EASE FLASH CORRIDAS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#0a0a0a;color:#fff}
.header{background:#111;padding:12px;text-align:center}
.header h1{color:#FFEB00;margin:0}
.tabs{display:flex;gap:5px;justify-content:center;padding:10px;background:#111}
.tab{padding:8px 12px;border-radius:20px;border:none;font-weight:bold;background:#333;color:#fff;font-size:11px}
.tab.active{background:#FFEB00;color:#000}
.section{display:none;padding:10px}
.section.active{display:block}
.card{background:#1c1c1c;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #333}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin:4px 0}
.btn{background:#FFEB00;color:#000;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;margin-top:6px}
#map{height:300px;border-radius:10px}
.item{background:#222;padding:10px;border-radius:8px;margin:5px 0}
</style>
</head>
<body>
<div class="header"><h1>EASE FLASH CORRIDAS</h1></div>
<div class="tabs">
<button class="tab active" onclick="show('c1')">CORRIDA</button>
<button class="tab" onclick="show('c2')">MOTORISTAS</button>
<button class="tab" onclick="show('c3')">CLIENTES</button>
<button class="tab" onclick="show('c4')">MAPA</button>
</div>
<div id="c1" class="section active">
<div class="card">
<select id="sc"></select>
<input id="o" placeholder="Origem - clique no mapa">
<input id="d" placeholder="Destino - clique no mapa">
<input id="v" type="number" placeholder="Valor R$">
<button class="btn" onclick="addC()">CRIAR CORRIDA</button>
</div>
<div id="lc"></div>
</div>
<div id="c2" class="section">
<div class="card">
<input id="mn" placeholder="Nome motorista">
<input id="mw" placeholder="WhatsApp">
<input id="mp" placeholder="Placa ou BIKE">
<button class="btn" onclick="addM()">CADASTRAR MOTORISTA</button>
</div>
<div id="lm"></div>
</div>
<div id="c3" class="section">
<div class="card">
<input id="cn" placeholder="Nome cliente">
<input id="cw" placeholder="WhatsApp">
<input id="ce" placeholder="Endereco">
<button class="btn" onclick="addCl()">CADASTRAR CLIENTE</button>
</div>
<div id="lcl"></div>
</div>
<div id="c4" class="section">
<div class="card"><div id="map"></div></div>
</div>
<script>
let map=null;
function init(){
 map=L.map('map').setView([-25.52,-48.52],13);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
 map.on('click',function(e){
  if(!o.value){o.value=e.latlng.lat.toFixed(4);}
  else{d.value=e.latlng.lat.toFixed(4);}
 });
 L.marker([-25.5205,-48.5223]).addTo(map).bindPopup('Centro');
 L.marker([-25.531,-48.51]).addTo(map).bindPopup('Vila Garcia');
 L.marker([-25.508,-48.522]).addTo(map).bindPopup('Rocio');
}
function show(id){
 document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 event.target.classList.add('active');
 if(id=='c4'&&!map)setTimeout(init,300);
 if(map)setTimeout(()=>map.invalidateSize(),300);
 load();
}
function get(k){return JSON.parse(localStorage.getItem(k)||'[]')}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function addM(){
 let m={n:mn.value,w:mw.value,p:mp.value,id:Date.now()};
 if(!m.n)return;
 let a=get('m');a.push(m);set('m',a);
 mn.value=mw.value=mp.value='';load();
}
function addCl(){
 let c={n:cn.value,w:cw.value,e:ce.value,id:Date.now()};
 if(!c.n)return;
 let a=get('cl');a.push(c);set('cl',a);
 cn.value=cw.value=ce.value='';load();
}
function addC(){
 let c={cl:sc.value,o:o.value,d:d.value,v:v.value,id:Date.now()};
 if(!c.o)return;
 let a=get('c');a.push(c);set('c',a);
 o.value=d.value=v.value='';load();
}
function load(){
 let a=get('m');let h='';
 for(let i=0;i<a.length;i++){h+='<div class=item><b>'+a[i].n+'</b> '+a[i].w+' '+a[i].p+'</div>';}
 if(!h)h='Nenhum motorista';lm.innerHTML=h;
 let b=get('cl');let h2='';
 for(let i=0;i<b.length;i++){h2+='<div class=item><b>'+b[i].n+'</b> '+b[i].w+'</div>';}
 if(!h2)h2='Nenhum cliente';lcl.innerHTML=h2;
 let c=get('c');let h3='';
 for(let i=0;i<c.length;i++){h3+='<div class=item>'+c[i].o+' -> '+c[i].d+' R$'+c[i].v+'</div>';}
 if(!h3)h3='Nenhuma corrida';lc.innerHTML=h3;
 let s=get('cl');let op='<option>Selecione cliente</option>';
 for(let i=0;i<s.length;i++){op+='<option>'+s[i].n+'</option>';}
 sc.innerHTML=op;
}
window.onload=function(){load();init();}
</script>
</body>
</html>
