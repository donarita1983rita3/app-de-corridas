  <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App de Corridas - Worldwide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0f0f0f;color:#fff}
.lang-bar{display:flex;justify-content:center;gap:6px;padding:12px;background:#0f0f0f;position:sticky;top:0;z-index:99;flex-wrap:wrap;border-bottom:1px solid #222}
.lang{padding:7px 12px;border-radius:20px;border:1px solid #333;cursor:pointer;font-size:11px;background:#1a1a1a;color:#aaa;font-weight:800;min-width:42px;text-align:center}
.lang.active{background:#fff;color:#111;border-color:#fff}
.grid{max-width:1100px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:#1a1a1a;border-radius:16px;padding:16px;border:1px solid #222}
label{font-size:10px;font-weight:800;color:#666;text-transform:uppercase;display:block;margin:10px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #2a2a2a;border-radius:12px;background:#111;color:#fff}
.btn{padding:14px 22px;border-radius:12px;border:0;font-weight:800;cursor:pointer;width:100%;margin-top:8px}
.btn-w{background:#fff;color:#111}
.btn-d{background:#222;color:#fff}
.btn-g{background:#25D366;color:#fff}
.result{background:#111;border:1px solid #333;border-radius:12px;padding:14px;margin-top:12px;text-align:center;display:none}
.agenda-item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #222}
.small{font-size:11px;color:#777}
</style>
</head>
<body>
<div class="lang-bar">
<span class="lang active" onclick="setLang('pt')">PT</span>
<span class="lang" onclick="setLang('es')">ES</span>
<span class="lang" onclick="setLang('en')">EN</span>
<span class="lang" onclick="setLang('zh')">中文</span>

<span class="lang" onclick="setLang('ko')">한국</span>
<span class="lang" onclick="setLang('fr')">FR</span>
<span class="lang" onclick="setLang('de')">DE</span>
<span class="lang" onclick="setLang('it')">IT</span>
<span class="lang" onclick="setLang('ar')">العربية</span>
<span class="lang" onclick="setLang('ru')">RU</span>

</div>

<div style="padding:30px 20px;text-align:center">
<h1 id="tHero">APP DE CORRIDAS - WORLDWIDE</h1>
<p id="pHero" class="small" style="margin-top:8px">GPS + PIX + Cartão + Motorista - 12 Idiomas</p>
</div>

<div class="grid" id="app">
<div class="card">
<h3 id="hNovo">Novo Pedido</h3>
<label id="lCat">Categoria</label>
<select id="categoria" onchange="escolherCategoria(this.value)">
<option value="barbearia">Barbearia</option>
<option value="viagem">Viagem / Entrega</option>
<option value="entrega">Entrega Rapida</option>
</select>
<label id="lCli">Cliente</label><input id="nome" placeholder="Nome">
<label id="lZap">WhatsApp</label><input id="zap" placeholder="55...">
<label id="lOri">Origem</label><input id="origem" placeholder="Origem">
<label id="lDes">Destino / Serviço</label><input id="destino" placeholder="Destino">
<button class="btn btn-d" id="bGPS" onclick="pegarGPS()">PEGAR MEU GPS</button>
<button class="btn btn-d" id="bCalc" onclick="calcularReal()">CALCULAR PREÇO</button>
<div id="resultado" class="result"></div>
<label id="lServ">Serviço</label><select id="serv"></select>
<label id="lData">Data</label><input id="data" type="date">
<label id="lHora">Hora</label><input id="hora" type="time">
<button class="btn btn-w" id="bConf" onclick="confirmarPagamento()">CONFIRMAR E SALVAR</button>
<button class="btn btn-g" id="bZap" onclick="enviarZapMotorista()">ENVIAR NO ZAP DO MOTORISTA</button>
<button class="btn btn-d" id="bPix" onclick="copiarPix()">COPIAR PIX</button>
<button class="btn btn-d" id="bCart" onclick="pagarCartao()">PAGAR CARTAO</button>
</div>
<div class="card">
<h3 id="hHist">Histórico / Agenda</h3>
<button class="btn btn-d" style="padding:8px;font-size:11px" id="bLimpar" onclick="limparHist()">LIMPAR HISTORICO</button>
<div id="lista" style="margin-top:10px"></div>
<div style="margin-top:20px">
<h4 id="hMot" style="font-size:12px">MOTORISTAS</h4>
<input id="nomeMot" placeholder="Nome motorista" style="margin-top:6px">
<input id="zapMot" placeholder="Zap motorista">
<button class="btn btn-d" id="bCad" onclick="cadastrarMot()">CADASTRAR MOTORISTA</button>
<div id="listaMot" style="margin-top:10px"></div>
</div>
<div style="margin-top:12px;display:flex;justify-content:center"><div id="qrcode"></div></div>
</div>
</div>

<script>
let categoria='viagem'; let historico=JSON.parse(localStorage.getItem('hist_dona')||'[]'); let motoristas=JSON.parse(localStorage.getItem('mot_dona')||'[]');
let fixa=5; let pkm=2.5; let precoFinal=0; let lang='pt';

function escolherCategoria(t){categoria=t; calcularReal();}
async function pegarGPS(){if(!navigator.geolocation){alert('GPS nao suportado');return;} navigator.geolocation.getCurrentPosition(p=>{document.getElementById('origem').value=p.coords.latitude+','+p.coords.longitude;}, e=>alert('Erro GPS'));}
async function calcularReal(){let dest=document.getElementById('destino').value||'5'; let dist=5; if(!isNaN(parseFloat(dest))){dist=parseFloat(dest)} precoFinal=Math.round(fixa + dist * pkm); let noturno=horaNoturna(); if(noturno)precoFinal=Math.round(precoFinal*1.2); let res=document.getElementById('resultado'); res.style.display='block'; res.innerHTML=`<b>${getT('dist')}: ${dist}km</b><br>${getT('price')}: R$${precoFinal} ${noturno?'(noturno)':''}`; return precoFinal;}
function horaNoturna(){let h=new Date().getHours(); return h>=22||h<=5;}
function copiarPix(){navigator.clipboard.writeText('SEU-PIX-AQUI').then(()=>alert('PIX copiado'));}
function pagarCartao(){window.open('https://mpago.la/link','_blank');}
function enviarZapMotorista(){let nome=document.getElementById('nome').value; let origem=document.getElementById('origem').value; let dest=document.getElementById('destino').value; if(!nome){alert(getT('fillName'));return;} let txt=`${getT('newOrder')}: ${nome} - ${getT('from')}: ${origem} ${getT('to')}: ${dest} - ${getT('price')}: R$${precoFinal}`; let zap = motoristas[0]?.zap || '5541999999999'; window.open(`https://wa.me/${zap.replace(/\D/g,'')}?text=${encodeURIComponent(txt)}`,'_blank');}
function confirmarPagamento(){let nome=document.getElementById('nome').value; let serv=document.getElementById('serv').value; let data=document.getElementById('data').value; let hora=document.getElementById('hora').value; if(!nome){alert(getT('fillName'));return;} let o={id:Date.now(),nome,serv,data,hora,valor:precoFinal,categoria,destino:document.getElementById('destino').value}; historico.unshift(o); localStorage.setItem('hist_dona',JSON.stringify(historico)); atualizarHist(); gerarQR(12); alert(getT('saved')+' R$'+precoFinal);}
function cadastrarMot(){let n=document.getElementById('nomeMot').value; let z=document.getElementById('zapMot').value; if(!n||!z){alert(getT('fillDriver'));return;} motoristas.push({nome:n,zap:z}); localStorage.setItem('mot_dona',JSON.stringify(motoristas)); renderMot();}
function atualizarHist(){let h=document.getElementById('lista'); h.innerHTML=historico.map(o=>`<div class='agenda-item'><div><b>${o.nome}</b><br><span class='small'>${o.data||''} ${o.hora||''} - ${o.serv||o.destino||''} - R$${o.valor||0}</span></div></div>`).join('') || `<span class=small>${getT('noHist')}</span>`;}
function limparHist(){localStorage.removeItem('hist_dona'); historico=[]; atualizarHist();}
function gerarQR(t){let q=document.getElementById('qrcode'); if(q)q.innerHTML=`<div style='width:120px;height:120px;background:#fff;color:#111;display:grid;place-items:center;font-weight:900;border-radius:8px'>PIX QR<br>R$${precoFinal}</div>`;}
function renderMot(){let el=document.getElementById('listaMot'); el.innerHTML=motoristas.map(m=>`<div class='agenda-item'><span>${m.nome}</span><span class='small'>${m.zap}</span></div>`).join('');}
