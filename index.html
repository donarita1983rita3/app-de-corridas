body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;padding:15px}

.btn{width:100%;background:#FFEB00;color:#000;font-weight:bold;padding:16px;border-radius:12px;border:none;font-size:16px;cursor:pointer}
.success{display:none;background:#00c851;color:#fff;padding:12px;border-radius:10px;margin-top:12px;text-align:center;font-weight:bold}
small{color:#888;display:block;text-align:center;margin-top:10px}
</style>
</head>
