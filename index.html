<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App de Corridas</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    h2 {
      margin-top: 0;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      font-weight: bold;
    }

    button:active {
      transform: scale(.98);
    }

    #map {
      width: 100%;
      height: 350px;
      border-radius: 14px;
      margin-top: 10px;
      background: #ddd;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-top: 15px;
    }

    .status {
      margin-top: 10px;
      padding: 12px;
      background: #eee;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<header>
  🚗 Meu App de Corridas
</header>

<div class="container">

  <div class="card">
    <h2>Passageiro</h2>

    <input
      id="origem"
      type="text"
      placeholder="Local de partida">

    <input
      id="destino"
      type="text"
      placeholder="Destino">

    <button onclick="usarGPS()">
      📍 Usar minha localização
    </button>

    <button onclick="calcularCorrida()">
      🚕 Solicitar corrida
    </button>

    <div class="price" id="preco">
      R$ 0,00
    </div>

    <div class="status" id="status">
      Aguardando solicitação...
    </div>
  </div>

  <div class="card">
    <h2>Motorista</h2>

    <button onclick="aceitarCorrida()">
      ✅ Aceitar corrida
    </button>

    <button onclick="iniciarCorrida()">
      ▶️ Iniciar corrida
    </button>

    <button onclick="finalizarCorrida()">
      🏁 Finalizar corrida
    </button>

    <div class="status" id="motoristaStatus">
      Motorista aguardando...
    </div>
  </div>

  <div class="card">
    <h2>📍 Mapa</h2>
    <div id="map"></div>
  </div>

</div>

<script>

let latitude = null;
let longitude = null;

let distancia = 0;
let preco = 0;

function usarGPS() {

  if (!navigator.geolocation) {
    alert("Seu celular não suporta GPS.");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude = position.coords.latitude;
      longitude = position.coords.longitude;

      document.getElementById("origem").value =
        latitude.toFixed(6) + ", " +
        longitude.toFixed(6);

      document.getElementById("status").innerText =
        "📍 Localização encontrada.";

      mostrarMapa(latitude, longitude);
    },

    function(error) {

      alert(
        "Não foi possível acessar sua localização. " +
        "Verifique a permissão de localização do navegador."
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 10000
    }
  );
}


function calcularCorrida() {

  const origem = document.getElementById("origem").value;
  const destino = document.getElementById("destino").value;

  if (!origem || !destino) {

    alert("Informe a partida e o destino.");

    return;
  }

  /*
    Cálculo provisório.

    Depois vamos substituir pelo cálculo real
    usando Google Maps Routes/Directions API.
  */

  distancia = 5;

  const tarifaBase = 5.00;
  const valorPorKm = 2.50;

  preco = tarifaBase + (distancia * valorPorKm);

  document.getElementById("preco").innerText =
    "R$ " + preco.toFixed(2).replace(".", ",");

  document.getElementById("status").innerText =
    "🚕 Corrida solicitada. Aguardando motorista...";

}


function aceitarCorrida() {

  document.getElementById("motoristaStatus").innerText =
    "✅ Motorista aceitou a corrida.";

  document.getElementById("status").innerText =
    "🚗 Motorista está a caminho.";
}


function iniciarCorrida() {

  document.getElementById("motoristaStatus").innerText =
    "▶️ Corrida iniciada.";

  document.getElementById("status").innerText =
    "🚕 Corrida em andamento.";
}


function finalizarCorrida() {

  document.getElementById("motoristaStatus").innerText =
    "🏁 Corrida finalizada.";

  document.getElementById("status").innerText =
    "✅ Corrida concluída.";

}


function mostrarMapa(lat, lng) {

  const mapa = document.getElementById("map");

  mapa.innerHTML = `
    <iframe
      width="100%"
      height="100%"
      style="border:0;border-radius:14px;"
      loading="lazy"
      src="https://www.google.com/maps?q=${lat},${lng}&z=15&output=embed">
    </iframe>
  `;
}

</script>

</body>
</html>
